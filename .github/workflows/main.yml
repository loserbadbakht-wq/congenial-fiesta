name: Build Firefox Extension and Push to Repo

on:
  push:
    branches: [firefox]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bundle Video.js and content script
        run: npm run build

      - name: Prepare dist (manifest + icons)
        run: |
          mkdir -p dist/icons
          cp manifest.json dist/
          cp icons/*.png dist/icons/
          # Include license files in the final package as well
          cp LICENSE dist/ || true
          cp NOTICE dist/ || true

      - name: Lint extension
        run: npx web-ext lint --source-dir dist

      - name: Build extension package
        run: npx web-ext build --source-dir dist --artifacts-dir web-ext-artifacts

      - name: Commit and push built extension to repo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/out
          cp web-ext-artifacts/*.zip /tmp/out/

          git reset --hard HEAD
          git checkout --orphan builds-firefox
          git rm -rf . || true

          cp /tmp/out/*.zip .
          printf "# Latest Firefox Build\n\nDownload the latest extension below.\n" > README.md

          git add -A
          git commit -m "Auto-build (Firefox): $(date +'%Y-%m-%d %H:%M:%S')"
          git push -f origin builds-firefox
