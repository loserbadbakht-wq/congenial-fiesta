name: Build Chrome Extension and Push to Repo

on:
  push:
    branches: [chrome]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bundle Video.js and content script
        run: npm run build

      - name: Prepare dist (manifest + static files)
        run: |
          mkdir -p dist/icons
          cp manifest.json dist/
          cp icons/*.png dist/icons/
          cp LICENSE dist/
          cp NOTICE dist/

      - name: Package extension
        run: |
          set -e
          npm run package
          ls -la gamefa-videojs-chrome.zip

      - name: Commit and push built extension to repo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/out
          cp gamefa-videojs-chrome.zip /tmp/out/

          git reset --hard HEAD
          git checkout --orphan builds-chrome
          git rm -rf . || true

          cp /tmp/out/gamefa-videojs-chrome.zip .
          printf "# Latest Chrome Build\n\nDownload the latest extension below.\n" > README.md

          git add -A
          git commit -m "Auto-build (Chrome): $(date +'%Y-%m-%d %H:%M:%S')"
          git push -f origin builds-chrome
