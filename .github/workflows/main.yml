name: Build Firefox Extension and Push to Repo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Bundle Video.js and content script
        run: npm run build

      - name: Prepare dist (manifest + icons)
        run: |
          mkdir -p dist/icons
          cp manifest.json dist/
          cp -r icons/. dist/icons/
          npm run icons

      - name: Lint extension
        run: npx web-ext lint --source-dir dist

      - name: Build extension package
        run: npx web-ext build --source-dir dist --artifacts-dir web-ext-artifacts

      - name: Commit and push built extension to repo
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Preserve the artifact outside the working tree
          mkdir -p /tmp/out
          cp web-ext-artifacts/*.zip /tmp/out/

          # 2. Drop any dirty tracked files (package-lock etc.) before branching
          git reset --hard HEAD

          # 3. Rebuild the `builds` branch from scratch
          git checkout --orphan builds
          git rm -rf . || true

          # 4. Put the new artifact and README in place (replaces everything)
          cp /tmp/out/*.zip .
          printf "# Latest Build\n\nDownload the latest extension build below.\n" > README.md

          # 5. Commit and overwrite the remote `builds` branch
          git add -A
          git commit -m "Auto-build: $(date +'%Y-%m-%d %H:%M:%S')"
          git push -f origin builds
