name: Build Firefox Extension and Push to Repo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bundle Video.js and content script
        run: npm run build

      - name: Prepare dist (manifest + icons)
        run: |
          mkdir -p dist/icons
          cp manifest.json dist/

          # 48×48 from the 96×96 PNG
          convert icons/favicon-96x96.png -resize 48x48 dist/icons/icon-48.png

          # 96×96 as-is
          cp icons/favicon-96x96.png dist/icons/icon-96.png

          # 128×128 from the 192×192 PNG
          convert icons/web-app-manifest-192x192.png -resize 128x128 dist/icons/icon-128.png

      - name: Lint extension
        run: npx web-ext lint --source-dir dist

      - name: Build extension package
        run: npx web-ext build --source-dir dist --artifacts-dir web-ext-artifacts

      - name: Commit and push built extension to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan builds
          git rm -rf --cached .

          cp web-ext-artifacts/*.zip .

          git add *.zip
          printf "# Latest Build\n\nDownload the latest extension build below.\n" > README.md
          git add README.md

          git commit -m "Auto-build: $(date +'%Y-%m-%d %H:%M:%S')"
          git push -f origin builds
