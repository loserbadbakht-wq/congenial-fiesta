name: Zensical Docs

on:
  push:
    branches: [main]
  workflow_dispatch:        # allows manual scaffolding run

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Zensical
        run: pip install zensical

      - name: Scaffold Zensical (if missing)
        run: |
          if [ ! -f zensical.toml ]; then
            zensical new .
          else
            echo "zensical.toml already exists — skipping scaffold"
          fi

      - name: Build site
        run: zensical build --clean

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
