name: Download Apple Color Emoji Fonts

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      folder_name:
        description: 'Target folder (optional; default: AppleColorEmoji)'
        required: false
        type: string
        default: 'AppleColorEmoji'

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all files
        id: dl
        env:
          USER_FOLDER: ${{ inputs.folder_name }}
          ALL_URLS: |
            https://uploadkon.ir/uploads/08bf21_26favicon.svg
            https://uploadkon.ir/uploads/c82021_26apple-touch-icon.png
            https://uploadkon.ir/uploads/5d0921_26web-app-manifest-512x512.png
            https://uploadkon.ir/uploads/ddfc21_26favicon-96x96.png
            https://uploadkon.ir/uploads/1b6521_26web-app-manifest-192x192.png

        run: |
          set -euo pipefail
          UA='Mozilla/5.0'

          # --- sanitize folder_name ---
          if [ -z "${USER_FOLDER:-}" ]; then
            USER_FOLDER="AppleColorEmoji"
          fi
          USER_FOLDER="${USER_FOLDER#/}"
          USER_FOLDER="${USER_FOLDER%/}"
          if [ -z "$USER_FOLDER" ] || printf '%s' "$USER_FOLDER" | grep -qE '(^|/)\.\.(/|$)'; then
            echo "::error::Invalid folder_name: '${{ inputs.folder_name }}'"
            exit 1
          fi

          mkdir -p "$USER_FOLDER"
          DOWNLOADED=0

          while IFS= read -r url; do
            url="$(printf '%s' "$url" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$url" ] && continue

            # Resolve filename: Content-Disposition first, then URL path
            HEADERS=$(mktemp)
            FINAL_URL=$(curl -sIL -g -A "$UA" -D "$HEADERS" -o /dev/null \
                          -w '%{url_effective}' "$url" || true)

            CD=$(tr -d '\r' < "$HEADERS" | grep -i '^content-disposition:' | tail -n1 || true)
            FILE_NAME=""
            if [ -n "$CD" ]; then
              FILE_NAME=$(printf '%s\n' "$CD" | sed -n "s/.*filename\*=\([^']*\)''\([^;]*\).*/\2/p" | head -n1)
              [ -n "$FILE_NAME" ] && FILE_NAME=$(printf '%b' "${FILE_NAME//%/\\x}")
              [ -z "$FILE_NAME" ] && FILE_NAME=$(printf '%s\n' "$CD" | sed -n 's/.*filename="\([^"]*\)".*/\1/p' | head -n1)
              [ -z "$FILE_NAME" ] && FILE_NAME=$(printf '%s\n' "$CD" | sed -n 's/.*filename=\([^;]*\).*/\1/p' | head -n1 | tr -d '"')
            fi
            [ -z "$FILE_NAME" ] && FILE_NAME=$(printf '%s\n' "$FINAL_URL" | sed 's/[?#].*$//' | awk -F'/' '{print $NF}')
            [ -z "$FILE_NAME" ] && FILE_NAME=$(printf '%s\n' "$url"       | sed 's/[?#].*$//' | awk -F'/' '{print $NF}')

            if [ -z "$FILE_NAME" ]; then
              echo "::warning::Could not determine filename for $url — skipping"
              continue
            fi
            FILE_NAME=$(basename "$FILE_NAME")

            echo ">> $url"
            echo "   -> $USER_FOLDER/$FILE_NAME"

            # -g disables curl's globbing so [ ] in URLs are literal
            curl -L -g --fail --retry 3 --retry-delay 5 \
              -A "$UA" \
              -o "$USER_FOLDER/$FILE_NAME" \
              "$url"

            MIME=$(file --mime-type -b "$USER_FOLDER/$FILE_NAME")
            echo "   mime: $MIME"
            DOWNLOADED=$((DOWNLOADED + 1))
          done <<< "$ALL_URLS"

          if [ "$DOWNLOADED" -eq 0 ]; then
            echo "::error::No files downloaded."
            exit 1
          fi

          echo "folder_name=$USER_FOLDER" >> "$GITHUB_OUTPUT"
          echo "Downloaded $DOWNLOADED files into $USER_FOLDER/"
          ls -la "$USER_FOLDER"

      - name: Commit and push
        env:
          FOLDER_NAME: ${{ steps.dl.outputs.folder_name }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f "$FOLDER_NAME"

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Add ${FOLDER_NAME}"
          git push
